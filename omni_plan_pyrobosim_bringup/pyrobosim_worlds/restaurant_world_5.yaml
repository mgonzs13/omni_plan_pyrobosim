# Pyrobosim restaurant world definition
#
# Layout:
#   ┌──────────┐     ┌──────────────────────────────────┐
#   │  Trash   │─────│            Kitchen                │
#   └──────────┘     └───────────────┬──────────────────┘
#                                    │
#                    ┌───────────────┴──────────────────┐
#   ┌──────────┐    │         Dining Room               │
#   │   Bar    │─────│  [table1] [table2] [table3]      │
#   └──────────┘    │  [table4] [table5] [table6]      │
#                    └───────────────┬──────────────────┘
#                                    │
#                    ┌───────────────┴──────────────────┐
#                    │          Entrance                 │
#                    └──────────────────────────────────┘

params:
  name: restaurant_world
  inflation_radius: 0.05
  object_radius: 0.02
  wall_height: 2.5

metadata:
  locations:
    - $PWD/locations.yaml
  objects:
    - $PWD/objects.yaml

robots:
  - name: waiter1
    radius: 0.18
    height: 0.5
    location: kitchen_counter
    max_linear_velocity: 1.2
    max_angular_velocity: 2.0
    max_linear_acceleration: 0.5
    max_angular_acceleration: 1.0
    path_planner:
      type: astar
      grid_resolution: 0.1
      grid_inflation_radius: 0.1
    path_executor:
      type: constant_velocity
      linear_velocity: 0.5
      dt: 0.1
    grasp_generator:
      type: parallel_grasp
      max_width: 0.175
      depth: 0.1
      height: 0.04
      width_clearance: 0.01
      depth_clearance: 0.01
    action_execution_options:
      navigate:
        delay: 0.1
        success_probability: 1.0
        battery_usage: 1.0
      pick:
        delay: 0.5
        success_probability: 1.0
        battery_usage: 0.5
      place:
        delay: 0.5
        success_probability: 1.0
        battery_usage: 0.5

  - name: waiter2
    radius: 0.18
    height: 0.5
    location: table4
    max_linear_velocity: 1.2
    max_angular_velocity: 2.0
    max_linear_acceleration: 0.5
    max_angular_acceleration: 1.0
    path_planner:
      type: astar
      grid_resolution: 0.1
      grid_inflation_radius: 0.1
    path_executor:
      type: constant_velocity
      linear_velocity: 0.5
      dt: 0.1
    grasp_generator:
      type: parallel_grasp
      max_width: 0.175
      depth: 0.1
      height: 0.04
      width_clearance: 0.01
      depth_clearance: 0.01
    action_execution_options:
      navigate:
        delay: 0.1
        success_probability: 1.0
        battery_usage: 1.0
      pick:
        delay: 0.5
        success_probability: 1.0
        battery_usage: 0.5
      place:
        delay: 0.5
        success_probability: 1.0
        battery_usage: 0.5

  - name: waiter3
    radius: 0.18
    height: 0.5
    location: bar_counter0
    max_linear_velocity: 1.2
    max_angular_velocity: 2.0
    max_linear_acceleration: 0.5
    max_angular_acceleration: 1.0
    path_planner:
      type: astar
      grid_resolution: 0.1
      grid_inflation_radius: 0.1
    path_executor:
      type: constant_velocity
      linear_velocity: 0.5
      dt: 0.1
    grasp_generator:
      type: parallel_grasp
      max_width: 0.175
      depth: 0.1
      height: 0.04
      width_clearance: 0.01
      depth_clearance: 0.01
    action_execution_options:
      navigate:
        delay: 0.1
        success_probability: 1.0
        battery_usage: 1.0
      pick:
        delay: 0.5
        success_probability: 1.0
        battery_usage: 0.5
      place:
        delay: 0.5
        success_probability: 1.0
        battery_usage: 0.5

  - name: waiter4
    radius: 0.18
    height: 0.5
    location: dumpster
    max_linear_velocity: 1.2
    max_angular_velocity: 2.0
    max_linear_acceleration: 0.5
    max_angular_acceleration: 1.0
    path_planner:
      type: astar
