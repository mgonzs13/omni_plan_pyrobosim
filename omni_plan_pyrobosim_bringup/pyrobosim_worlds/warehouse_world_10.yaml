rooms:
  - name: entrance
    footprint:
      type: box
      dims: [4.0, 4.0]
    pose:
      position:
        x: -10.0
        y: 8.0
    color: [0.8, 0.8, 0.2]

  - name: package_preparation
    footprint:
      type: box
      dims: [6.0, 4.0]
    pose:
      position:
        x: 0.0
        y: 0.0
    color: [0.2, 0.8, 0.8]

  - name: storage
    footprint:
      type: box
      dims: [10.0, 8.0]
    pose:
      position:
        x: 0.0
        y: 8.0
    color: [0.7, 0.7, 0.7]

  - name: delivery
    footprint:
      type: box
      dims: [4.0, 4.0]
    pose:
      position:
        x: 8.0
        y: 0.0
    color: [0.9, 0.6, 0.2]

hallways:
  - room_start: entrance
    room_end: storage
    width: 1.5
    conn_method: auto
    is_open: true
    is_locked: false

  - room_start: package_preparation
    room_end: storage
    width: 2.0
    conn_method: auto
    is_open: true
    is_locked: false

  - room_start: package_preparation
    room_end: delivery
    width: 1.5
    conn_method: auto
    is_open: true
    is_locked: false

locations:
  # Entrance tables for incoming packages
  - name: entrance_table1
    category: table
    parent: entrance
    pose:
      position:
        x: -1.0
        y: 1.0
      relative_to: entrance

  - name: entrance_table2
    category: table
    parent: entrance
    pose:
      position:
        x: 1.0
        y: 1.0
      relative_to: entrance

  # Package preparation tables
  - name: prep_table1
    category: table
    parent: package_preparation
    pose:
      position:
        x: -1.5
        y: 0.5
      relative_to: package_preparation

  - name: prep_table2
    category: table
    parent: package_preparation
    pose:
      position:
        x: 0.0
        y: 0.5
      relative_to: package_preparation

  - name: prep_table3
    category: table
    parent: package_preparation
    pose:
      position:
        x: 1.5
        y: 0.5
      relative_to: package_preparation

  # Storage room shelves
  - name: storage_shelf1
    category: shelf
    parent: storage
    pose:
      position:
        x: -3.0
        y: 2.5
      relative_to: storage

  # Chargers
  # Chargers
  - name: charger1
    category: charger
    parent: entrance
    pose:
      position:
        x: 0.0
        y: -1.7
      relative_to: entrance
    is_open: false
    is_locked: true
    is_charger: true

  - name: charger2
    category: charger
    parent: storage
    pose:
      position:
        x: -3.5
        y: -3.7
      relative_to: storage
    is_open: false
    is_locked: true
    is_charger: true

  - name: charger3
    category: charger
