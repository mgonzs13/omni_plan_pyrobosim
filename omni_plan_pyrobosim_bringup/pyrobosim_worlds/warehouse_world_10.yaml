  # Delivery room tables
  - name: delivery_table1
    category: table
    parent: delivery
    pose:
      position:
        x: -1.0
        y: 1.0
      relative_to: delivery

  - name: delivery_table2
    category: table
    parent: delivery
    pose:
      position:
        x: 1.0
        y: 1.0
