        y: -1.7
      relative_to: delivery
    is_open: false
    is_locked: true
    is_charger: true

  - name: storage_shelf2
    category: shelf
    parent: storage
    pose:
      position:
        x: 0.0
        y: 2.5
      relative_to: storage

  - name: storage_shelf3
    category: shelf
    parent: storage
    pose:
      position:
        x: 3.0
        y: 2.5
      relative_to: storage

  - name: storage_shelf4
