# Warehouse shelf object
shelf:
  footprint:
    type: box
    dims: [2.0, 0.6]
    height: 2.2
  color: [0.7, 0.7, 0.2]

# Warehouse package object
package:
  footprint:
    type: box
    dims: [0.25, 0.18]
    height: 0.15
  color: [0.8, 0.5, 0.2]

# Object categories for the pyrobosim restaurant world
