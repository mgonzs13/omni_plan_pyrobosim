# Location categories for the pyrobosim restaurant world

table:
  footprint:
    type: box
    dims: [1.0, 1.0]
    height: 0.75
  nav_poses:
    - [-0.75, 0, 0]
    - [0.75, 0, 0.0, 3.14]
    - [0, -0.75, 0.0, 1.57]
    - [0, 0.75, 0.0, -1.57]
  locations:
    - name: "surface"
      footprint:
        type: parent
        padding: 0.05
  color: [0.55, 0.27, 0.07]

counter:
  footprint:
    type: box
    dims: [4.0, 0.6]
    height: 0.9
  nav_poses:
    - [0, 0.6, 0.0, -1.57]
    - [0, -0.6, 0.0, 1.57]
  locations:
    - name: "top"
      footprint:
        type: parent
        padding: 0.05
  color: [0.4, 0.4, 0.4]

bar_counter:
  footprint:
    type: box
    dims: [3.0, 0.5]
    height: 1.1
  nav_poses:
    - [0, 0.6, 0.0, -1.57]
    - [0, -0.6, 0.0, 1.57]
  locations:
    - name: "top"
      footprint:
        type: parent
        padding: 0.05
  color: [0.3, 0.15, 0.05]

shelf:
  footprint:
    type: box
    dims: [2.0, 1.0]
    height: 1.8
  nav_poses:
    - [0, 0.8, 0.0, -1.07]
    - [0, -0.8, 0.0, 1.07]
  locations:
    - name: "front"
      footprint:
        type: parent
        padding: 0.05
  color: [0.6, 0.4, 0.2]

reception_desk:
  footprint:
    type: box
    dims: [1.2, 0.6]
    height: 1.0
  nav_poses:
    - [0, 0.6, 0.0, -1.57]
    - [0, -0.6, 0.0, 1.57]
  locations:
    - name: "top"
      footprint:
        type: parent
        padding: 0.05
  color: [0.2, 0.2, 0.5]

dumpster:
  footprint:
    type: circle
    radius: 0.6
    height: 0.5
  nav_poses:
    - [0, 0.8, 0.0, -1.57]
    - [0, -0.8, 0.0, 1.57]
  locations:
    - name: "top"
      footprint:
        type: parent
        padding: 0.05
  color: [0.1, 0.1, 0.1]

charger:
  footprint:
    type: polygon
    coords:
      - [-0.3, -0.15]
      - [0.3, -0.15]
      - [0.3, 0.15]
      - [-0.3, 0.15]
    height: 0.1
  locations:
    - name: "dock"
      footprint:
        type: parent
      nav_poses:
        - position: # above
            x: 0.0
            y: 0.5
          rotation_eul:
            yaw: -1.57
  color: [0.4, 0.4, 0]
